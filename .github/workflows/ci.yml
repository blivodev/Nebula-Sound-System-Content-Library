# SPDX-License-Identifier: CC0-1.0
name: Content Library CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-index-and-licenses:
    name: Validate Index & Licenses
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify index.json and CONTENT_LICENSES.md
        run: |
          python tools/build_index.py --check
